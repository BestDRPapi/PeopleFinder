[blueiris]
# BlueIris server settings
server_url = http://localhost:81
username = admin
password = your_password_here
# Maximum number of cameras to check (BlueIris supports up to 64)
max_cameras = 64
# Timeout for camera connections in seconds
connection_timeout = 10

[face_recognition]
# Face recognition tolerance (lower is more strict)
tolerance = 0.6
# Image processing scale (smaller = faster but less accurate)
scale_factor = 0.25

[logging]
# Log level: DEBUG, INFO, WARNING, ERROR
level = INFO
# Log file path (leave empty for console only)
file = people_finder.log